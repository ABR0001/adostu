<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abrir sala en Adostu…</title>
<style>
  :root { color-scheme: light dark }
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  a.button { display:inline-block; padding:.75rem 1rem; border-radius:.5rem; border:1px solid currentColor; text-decoration:none }
  .muted{opacity:.7}
</style>
<body>
<h1>Abriendo sala…</h1>
<p class="muted">Si no se abre automáticamente, usa el botón de abajo.</p>
<p id="fallback"></p>

<script>
(function () {
  // Para GitHub Pages de proyecto: /adostu/j/CODIGO
  // y también soporta /j/CODIGO
  var parts = location.pathname.split("/").filter(Boolean);
  var jIndex = parts.indexOf("j");
  var code = (jIndex >= 0 && parts[jIndex+1]) ? parts[jIndex+1].toUpperCase() : "";

  // 1) Deep link a la app
  var deeplink = "adostu://app/join/" + code;

  // 2) Fallback: Play Store
  var playUrl = "https://play.google.com/store/apps/details?id=com.abr000.adostu";

  // 🔎 Detectar iOS
  var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (isIOS) {
    // Idioma principal del dispositivo (ej: "es-ES", "eu-ES", "en-US", ...)
    var lang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
    var short = lang.split("-")[0]; // "es", "eu", "en", ...

    var titleText;
    var subtitleText;

    if (short === "es") {
      titleText = "Usas iPhone…";
      subtitleText = "Esto es para gente que toma buenas decisiones 😉";
    } else if (short === "eu") {
      titleText = "iPhone erabiltzen duzu…";
      subtitleText = "Hau erabaki onak hartzen dituztenentzat da 😉";
    } else {
      titleText = "You use an iPhone…";
      subtitleText = "This is for people who make good decisions 😉";
    }

    var h1 = document.querySelector("h1");
    if (h1) h1.textContent = titleText;

    var muted = document.querySelector(".muted");
    if (muted) muted.textContent = subtitleText;

    // Limpiamos el área del botón
    var fb = document.getElementById("fallback");
    if (fb) fb.textContent = "";

    // Muy importante: NO intentamos abrir la app ni ir a Play Store
    return;
  }

  // --- Comportamiento normal (Android, etc.) ---

  // Intento de abrir la app
  var opened = false;
  function tryOpen() {
    location.href = deeplink;
    setTimeout(function(){
      if (!opened) location.replace(playUrl);
    }, 800);
  }

  window.addEventListener("pageshow", function(){ opened = true; });

  // Lanza apertura de app
  tryOpen();

  // Botón manual
  var a = document.createElement("a");
  a.className = "button";
  a.href = deeplink;
  a.textContent = "Abrir sala " + (code || "");
  document.getElementById("fallback").appendChild(a);
})();
</script>
</body>
</html>
